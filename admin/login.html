<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <meta
        name="description"
        content="MindThinkMedia administrator login."
    >

    <title>Admin Login — MindThinkMedia</title>

    <link
        rel="stylesheet"
        href="./css/admin.css"
    >

</head>


<body class="admin-login-page">

    <main class="login-container">

        <section
            class="login-card"
            aria-labelledby="login-title"
        >

            <!-- ==================================================
                 BRAND
                 ================================================== -->

            <div class="login-brand">

                <div
                    class="login-logo"
                    aria-hidden="true"
                >
                    M
                </div>

                <div>

                    <h1>
                        MindThinkMedia
                    </h1>

                    <p>
                        Content Management System
                    </p>

                </div>

            </div>


            <!-- ==================================================
                 LOGIN HEADING
                 ================================================== -->

            <div class="login-heading">

                <h2 id="login-title">
                    Admin Login
                </h2>

                <p>
                    Sign in to manage your articles.
                </p>

            </div>


            <!-- ==================================================
                 LOGIN FORM
                 ================================================== -->

            <form
                id="loginForm"
                novalidate
            >

                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="username"
                        placeholder="admin@mindthinkmedia.com"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-field">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- MESSAGE -->

                <div
                    id="loginMessage"
                    class="login-message"
                    role="alert"
                    aria-live="polite"
                ></div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >

                    <span id="loginButtonText">
                        Sign In
                    </span>

                    <span
                        id="loginSpinner"
                        class="login-spinner"
                        hidden
                        aria-hidden="true"
                    ></span>

                </button>

            </form>


            <!-- ==================================================
                 FOOTER
                 ================================================== -->

            <footer class="login-footer">

                <p>
                    MindThinkMedia Admin
                </p>

            </footer>

        </section>

    </main>


    <!-- ========================================================
         ADMIN AUTHENTICATION
         ======================================================== -->

    <script src="./js/auth.js"></script>

</body>

</html>
